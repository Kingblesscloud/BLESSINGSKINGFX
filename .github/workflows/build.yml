
name: BLESSINGSKINGFX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BLESSINGSKINGFX-Android-Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o BLESSINGSKINGFX-Android-Project.zip

      - name: Check project files
        run: |
          test -f BLESSINGSKINGFX-Android/settings.gradle
          test -f BLESSINGSKINGFX-Android/app/build.gradle

      - name: Build APK
        run: |
          gradle --no-daemon -p BLESSINGSKINGFX-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLESSINGSKINGFX-demo-apk
          path: BLESSINGSKINGFX-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
