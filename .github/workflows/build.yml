
name: BLESSINGSKINGFX Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BLESSINGSKINGFX-Android-Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o BLESSINGSKINGFX-Android-Project.zip

      - name: Build APK
        run: gradle --no-daemon -p BLESSINGSKINGFX-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLESSINGSKINGFX-demo-apk
          path: BLESSINGSKINGFX-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
